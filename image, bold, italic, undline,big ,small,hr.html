<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 1-if we are using the absolute url (means another image links that ours) -->
    <img
      src="https://media.istockphoto.com/id/623368750/photo/sacred-birma-cat-in-interior.jpg?s=612x612&w=0&k=20&c=KfNi_sRwTCtXTnnUvEYVBnRg9arrA3JBC7SppRtSRzs="
      alt="error"
      height="200"
    />
    <!-- it is simple to create by go to google and then by serach any image and click on any image and then right click and then click on (copy image address) and the paste it here ok -->
    <!-- 2 - if we are using saved image in the  same folder as we are working then we have to give relative url ok -->
    <!-- using snif tools download the image direct to the folder -->
    <br />
    <!-- br tag it is used to go to the another line or line break -->
    <img src="/image created using snif tools.png" alt="error" height="200" />
    <!-- we can also give height and width attribute to height tag -->
    <!-- for any image or any thing we can directly save it by right click and then save as it is also good choice -->
    <!-- use one at a time is good (height or width) -->
    <h1>Using Bold Italic and Underline</h1>
    <b>bold</b>
    <i>italic</i>
    <u>underline</u>
    <!-- heading is block level element so it take the full width of the parent container or elemnt which is body -->
    <!-- but bold italic and underline are the inline elemnts and contains the width of the content written in between them -->
    <h1>Using big and small tag</h1>
    <!-- big and small are inline elemnts -->
    <big>This text shown big</big>
    <small>this text is shown small </small>
    <br />
    <big
      >use this whenever you want big text dont use headings (use headins only
      for mains headings)</big
    >
    <h1>using hr tag</h1>
    <hr />
  </body>
</html>
