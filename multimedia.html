<!-- 1.acceleratometer
• What it means: This grants the video player permission to access your device's physical motion and tilt sensors.
• Why YouTube uses it: It allows the player to detect if you rotate your phone or tablet, so it can automatically switch the video between portrait and landscape viewports.

2. autoplay

• What it means: This gives the video permission to start playing automatically as soon as the webpage finishes loading.
• Why YouTube uses it: If you add &autoplay=1 to your video URL, the browser needs this permission enabled to actually let the video play without the user needing to click the "Play" button first.

3. clipboard-write

• What it means: This allows the embedded player to write text data directly to your device's clipboard (the temporary storage used when you copy something).
• Why YouTube uses it: When a user clicks the "Share" or "Copy Link" button inside the embedded YouTube player, this permission is what allows the player to successfully copy the video link to their phone or computer clipboard.

4. encrypted-media

• What it means: This allows the player to use DRM (Digital Rights Management) and cryptographic protocols to play protected video streams.
• Why YouTube uses it: Many high-quality, commercial, or copyrighted videos on YouTube require secure, encrypted streaming to prevent piracy. Without this, some music videos or premium content might refuse to load and throw an error.

5. gyroscope

• What it means: Similar to the accelerometer, this grants access to your device's angular velocity and rotation sensors.
• Why YouTube uses it: This is absolutely essential for 360-degree videos or Virtual Reality (VR) content on YouTube. It allows a mobile user to physically move their phone around to "look around" the scene inside the video.

6. picture-in-picture

• What it means: This permits the video player to separate the video track from the webpage into a small, floating window.
• Why YouTube uses it: It allows users to hit the picture-in-picture button so they can keep watching the video in a floating corner box while they scroll down your website or switch to a completely different browser tab. -->
